# Runs the Pest tests and a package audit on every pull request and on every
# push to main, plus a dependency review on pull requests.
# Nothing is deployed. No secrets are used.
#
# The Playwright runs (npm run test:e2e) need a running site, so they stay on
# your own laptop; see the README.

name: tests

on:
  pull_request:
  push:
    branches: [main]

# Read-only: this workflow never writes to the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Actions are pinned to a full commit, so a changed tag cannot change
      # what runs here. The comment says which release it is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP packages
        run: composer install --no-interaction --no-progress --prefer-dist

      # Pages in the tests load the built CSS and JS through Vite's manifest.
      - name: Install JS packages and build the assets
        run: |
          npm ci
          npm run build

      # Both must stay at 0 known vulnerabilities (see the README).
      - name: Check packages for known vulnerabilities
        run: |
          composer audit
          npm audit

      - name: Prepare .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run the tests
        run: php artisan test

  # Fails a pull request that adds a package with a known vulnerability.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
