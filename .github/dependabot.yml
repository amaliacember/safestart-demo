# Weekly update PRs for PHP packages, JS packages and the pinned GitHub Actions.
# Minor and patch updates come as one PR per ecosystem; major updates come one
# by one. Security fixes are not delayed by the cooldown.

version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    # Wait a week before suggesting a new release, so a hijacked
    # release is likely caught and pulled before it reaches us.
    cooldown:
      default-days: 7
    groups:
      composer:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
